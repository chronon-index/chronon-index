[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tly"
version = "0.1.0"
description = "TLY — index of humanity's total remaining life-years. Open, deterministic, reproducible."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
include = ["tly*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/rulings/ holds verbatim ruling artifacts (records, not project code)
extend-exclude = ["docs/rulings", "seed"]

[tool.ruff.lint]
# Frozen explicitly so CI and local can never drift on rule selection.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
