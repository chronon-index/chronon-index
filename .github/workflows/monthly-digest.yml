# S-06: monthly human-readable digest, generated from committed
# artifacts and committed back via the print bot's deploy key.
name: monthly-digest
on:
  schedule:
    - cron: "30 12 1 * *" # 1st of the month, 12:30 UTC
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PRINT_BOT_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: previous month's digest + site rebuild
        run: |
          MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          python -m tly.digest "$MONTH"
          python -m tly.build_public
      - name: commit
        run: |
          git config user.name "tly-print-bot"
          git config user.email "print-bot@users.noreply.github.com"
          git add docs/reports/digests/ site/
          git diff --cached --quiet && echo "no-op" || \
            git commit -m "digest: monthly report (automated)" && git push
