# S-10: the contract property suite runs on every change to contracts/.
name: contracts
on:
  push:
    paths: ["contracts/**", "foundry.toml"]
  pull_request:
    paths: ["contracts/**", "foundry.toml"]
jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
