# RP Part V Q7: red when the UN publishes a WPP revision newer than our
# source of record — the restatement becomes a governed bump, not a surprise.
name: wpp-revision-watch
on:
  schedule:
    - cron: "40 7 * * 3" # Wednesdays 07:40 UTC
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m tly.wpp_watch
