# The weekly print (RP Part VII): the CI run IS the official computation —
# logs public, artifacts hashed and committed to the archive/ hash chain.
# A print produced any other way is invalid (SPEC#4 AC-4.2).
#
# RESEARCH SERIES notice: until A-16 ratification and the G5 source-of-
# record switch, prints are research-mode (the commercial licensing gate
# correctly blocks the WHO-based path — tests/test_licensing_gate.py).
name: weekly-print
on:
  schedule:
    - cron: "5 12 * * 1" # Mondays 12:05 UTC (compute the 12:00 epoch)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch protection on main has no GitHub-Actions bypass actor, so the
          # print bot pushes over a write-enabled deploy key, which IS bypassable
          # (ruleset main-review-and-checks -> bypass list -> Deploy keys).
          # If the secret is unset, checkout falls back to GITHUB_TOKEN and the
          # push still works on an unprotected branch.
          ssh-key: ${{ secrets.PRINT_BOT_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' opentimestamps-client
      - name: gates (schema, manifests, immutability, reproducibility)
        run: >
          pytest -q tests/test_manifest_schema.py
          tests/test_snapshot_immutability.py
          tests/test_p5_reproducibility.py
      - name: compute and archive the epoch print
        run: python -m tly.ci_print
      - name: OTS-stamp the new record hash (SPEC#4 AC-4.3)
        run: python -m tly.ots_gate stamp
      - name: OTS publish gate — proof exists + matches, else block
        run: python -m tly.ots_gate verify
      - name: rebuild the publication surface from the committed artifacts
        run: python -m tly.build_public
      - name: commit the archived print
        run: |
          git config user.name "tly-print-bot"
          git config user.email "print-bot@users.noreply.github.com"
          git add archive/ data/vintages/ stamps/ site/
          git diff --cached --quiet && echo "epoch already archived — no-op" || \
            git commit -m "print: archive epoch (weekly CI computation)" && git push
